<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>キソモン - オンライン対戦</title>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --primary-color: #4a90e2;
      --secondary-color: #50e3c2;
      --bg-color: #f4f7f6;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-red: #e74c3c;
      --accent-green: #2ecc71;
      --accent-yellow: #f1c40f;
      --accent-purple: #9b59b6;
    }

    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      color: var(--primary-color);
      margin-bottom: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      background-color: #fafafa;
    }

    .hidden {
      display: none !important;
    }

    input[type="text"] {
      width: calc(100% - 22px);
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin: 5px;
    }

    button:hover {
      background-color: #357abd;
    }

    button:active {
      transform: scale(0.98);
    }

    button:disabled {
      background-color: #cccccc !important;
      cursor: not-allowed;
      transform: none;
    }

    .btn-action {
      width: 45%;
      margin: 2.5%;
      padding: 12px;
      font-weight: bold;
    }

    #btn-attack { background-color: var(--accent-red); }
    #btn-heal { background-color: var(--accent-green); }
    #btn-charge { background-color: var(--accent-yellow); color: #333; }
    #btn-guard { background-color: var(--accent-purple); }
    #btn-surrender { background-color: #7f8c8d; width: 95%; margin: 10px auto; display: block; }

    /* HP/SP ゲージ表示 */
    .status-bar-container {
      margin: 8px 0;
    }

    .status-label {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 3px;
      display: flex;
      justify-content: space-between;
    }

    .gauge-bg {
      width: 100%;
      height: 16px;
      background-color: #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
    }

    .gauge-fill {
      height: 100%;
      width: 100%;
      transition: width 0.3s ease;
    }

    .hp-fill { background-color: var(--accent-green); }
    .sp-fill { background-color: var(--accent-yellow); }

    /* タイマー */
    .timer-display {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      margin: 10px 0;
      color: #e67e22;
    }

    /* ログエリア */
    #log-area {
      height: 150px;
      overflow-y: auto;
      border: 1px solid #ccc;
      background-color: #fff;
      padding: 10px;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.4;
      display: flex;
      flex-direction: column-reverse;
    }

    .log-item {
      margin-bottom: 5px;
      border-bottom: 1px dashed #eee;
      padding-bottom: 3px;
    }

    /* ランク表示 */
    .rank-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      background-color: var(--primary-color);
      color: white;
      font-weight: bold;
      font-size: 12px;
      margin-left: 5px;
    }
  </style>
</head>
<body>

  <h1>👾 キソモン リアルタイムバトル</h1>

  <div class="container">
    <!-- ログイン・プロフィール登録設定画面 -->
    <div id="screen-login" class="card">
      <h2>プレイヤー情報</h2>
      <input type="text" id="input-username" placeholder="プレイヤー名を入力" maxlength="12">
      <button id="btn-login" onclick="login()">決定</button>
    </div>

    <!-- マッチング待機画面 -->
    <div id="screen-matching" class="card hidden">
      <h3>ようこそ、<span id="display-name"></span> さん</h3>
      <p>レート: <span id="display-rate">1000</span> <span id="display-rank" class="rank-badge">ビギナー</span></p>
      <hr>
      <button id="btn-match" onclick="startMatching()" style="width: 100%; padding: 15px; font-size: 18px;">対戦相手を探す</button>
      <p id="matching-status" style="text-align: center; color: #666;"></p>
    </div>

    <!-- 対戦画面 -->
    <div id="screen-battle" class="card hidden">
      <div class="timer-display">
        試合残り時間: <span id="match-timer">180</span>秒 | 行動制限時間: <span id="turn-timer">15</span>秒
      </div>

      <!-- 対戦相手エリア -->
      <div class="card" style="background-color: #fff0f0;">
        <h4>相手: <span id="opp-name">対戦相手</span></h4>
        <div class="status-bar-container">
          <div class="status-label"><span>HP</span><span id="opp-hp-text">100/100</span></div>
          <div class="gauge-bg"><div id="opp-hp-bar" class="gauge-fill hp-fill"></div></div>
        </div>
        <div class="status-bar-container">
          <div class="status-label"><span>SP</span><span id="opp-sp-text">0/100</span></div>
          <div class="gauge-bg"><div id="opp-sp-bar" class="gauge-fill sp-fill" style="width: 0%;"></div></div>
        </div>
      </div>

      <!-- プレイヤーエリア -->
      <div class="card" style="background-color: #f0f8ff;">
        <h4>あなた: <span id="my-name">自分</span></h4>
        <div class="status-bar-container">
          <div class="status-label"><span>HP</span><span id="my-hp-text">100/100</span></div>
          <div class="gauge-bg"><div id="my-hp-bar" class="gauge-fill hp-fill"></div></div>
        </div>
        <div class="status-bar-container">
          <div class="status-label"><span>SP</span><span id="my-sp-text">0/100</span></div>
          <div class="gauge-bg"><div id="my-sp-bar" class="gauge-fill sp-fill" style="width: 0%;"></div></div>
        </div>
      </div>

      <!-- 行動選択ボタン -->
      <div style="display: flex; flex-wrap: wrap; justify-content: center;">
        <button id="btn-attack" class="btn-action" onclick="playerAction('attack')">⚔️ こうげき<br><small>(SP+20)</small></button>
        <button id="btn-charge" class="btn-action" onclick="playerAction('charge')">⚡ ため<br><small>(SP+40)</small></button>
        <button id="btn-guard" class="btn-action" onclick="playerAction('guard')">🛡️ がード<br><small>(軽減/SP+10)</small></button>
        <button id="btn-heal" class="btn-action" onclick="playerAction('heal')">💊 かいふく<br><small>(SP100消費)</small></button>
      </div>
      <button id="btn-surrender" onclick="surrender()">🏳️ 降参する</button>

      <!-- バトルログ -->
      <h4>バトルログ</h4>
      <div id="log-area"></div>
    </div>
  </div>

  <script>
    // --- Firebase 初期設定 ---
    // ※ 実際の環境に合わせてご自身のFirebaseプロジェクトの設定に書き換えてください
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // --- ゲーム状態変数 ---
    let myId = 'user_' + Math.floor(Math.random() * 100000);
    let myName = '';
    let myRate = 1000;
    let matchRef = null;
    let roomId = null;
    let playerKey = null; // 'p1' または 'p2'
    let oppKey = null;

    let inBattle = false;
    let myHP = 100;
    let mySP = 0;
    let oppHP = 100;
    let oppSP = 0;

    let matchTimerInterval = null;
    let turnTimerInterval = null;
    let matchTimeLeft = 180;
    let turnTimeLeft = 15;

    // --- ランク計算 ---
    function getRankName(rate) {
      if (rate >= 1500) return 'マスター';
      if (rate >= 1300) return 'エキスパート';
      if (rate >= 1100) return 'レギュラー';
      return 'ビギナー';
    }

    // --- ログイン処理 ---
    function login() {
      const nameInput = document.getElementById('input-username').value.trim();
      if (!nameInput) {
        alert('名前を入力してください');
        return;
      }
      myName = nameInput;

      // ローカルストレージからレート読み込み
      const savedRate = localStorage.getItem('kisomon_rate');
      if (savedRate) {
        myRate = parseInt(savedRate, 10);
      }

      document.getElementById('display-name').innerText = myName;
      document.getElementById('display-rate').innerText = myRate;
      document.getElementById('display-rank').innerText = getRankName(myRate);

      document.getElementById('screen-login').classList.add('hidden');
      document.getElementById('screen-matching').classList.remove('hidden');
    }

    // --- マッチング処理 ---
    function startMatching() {
      document.getElementById('btn-match').disabled = true;
      document.getElementById('matching-status').innerText = '対戦相手を探しています...';

      const queueRef = db.ref('matchmaking/queue');

      queueRef.once('value').then(snapshot => {
        const queue = snapshot.val();
        let foundRoom = false;

        if (queue) {
          for (let key in queue) {
            const waitingPlayer = queue[key];
            if (waitingPlayer.id !== myId) {
              // 待機プレイヤー発見 -> 部屋作成
              foundRoom = true;
              roomId = 'room_' + Date.now();
              playerKey = 'p2';
              oppKey = 'p1';

              // 部屋作成と待ち行列削除
              db.ref('rooms/' + roomId).set({
                p1: waitingPlayer,
                p2: { id: myId, name: myName, rate: myRate, hp: 100, sp: 0, action: null },
                status: 'playing',
                turn: 1,
                roundResolved: false
              });

              db.ref('matchmaking/queue/' + key).remove();
              db.ref('matchmaking/matched/' + waitingPlayer.id).set({ roomId: roomId });

              initBattle(roomId);
              break;
            }
          }
        }

        if (!foundRoom) {
          // 待機プレイヤーがいない場合、自身をキューに追加
          const myQueueRef = queueRef.push();
          myQueueRef.set({
            id: myId,
            name: myName,
            rate: myRate,
            hp: 100,
            sp: 0,
            action: null
          });

          // 相手がマッチングしてくれるのを監視
          const matchedListener = db.ref('matchmaking/matched/' + myId);
          matchedListener.on('value', snap => {
            const data = snap.val();
            if (data && data.roomId) {
              matchedListener.off();
              matchedListener.remove();
              roomId = data.roomId;
              playerKey = 'p1';
              oppKey = 'p2';
              initBattle(roomId);
            }
          });

          // キュー登録解除（ページ閉じ等の対策）
          myQueueRef.onDisconnect().remove();
        }
      });
    }

    // --- バトル初期化 ---
    function initBattle(rId) {
      document.getElementById('screen-matching').classList.add('hidden');
      document.getElementById('screen-battle').classList.remove('hidden');

      matchRef = db.ref('rooms/' + rId);
      inBattle = true;

      document.getElementById('my-name').innerText = myName;
      document.getElementById('log-area').innerHTML = '';

      // 初期ステータス取得
      matchRef.once('value').then(snap => {
        const data = snap.val();
        const oppData = data[oppKey];
        document.getElementById('opp-name').innerText = oppData.name;
        logMsg(`⚔️ 対戦相手: ${oppData.name} (レート: ${oppData.rate}) とのバトルが開始しました！`);
      });

      // タイマー開始
      startTimers();

      // ルームの変更をリアルタイム監視
      matchRef.on('value', snap => {
        const data = snap.val();
        if (!data) return;

        updateBattleState(data);
      });
    }

    // --- 状態の更新とターン判定 ---
    function updateBattleState(data) {
      const myData = data[playerKey];
      const oppData = data[oppKey];

      if (!myData || !oppData) return;

      // ステータス同期
      myHP = myData.hp;
      mySP = myData.sp;
      oppHP = oppData.hp;
      oppSP = oppData.sp;

      updateUI();

      // 勝敗チェック
      if (myData.hp <= 0 || oppData.hp <= 0) {
        if (myData.hp <= 0 && oppData.hp <= 0) {
          finishBattle('draw');
        } else if (myData.hp <= 0) {
          finishBattle('lose');
        } else {
          finishBattle('win');
        }
        return;
      }

      // 両者のアクションが決定している場合、P1側が計算を担当
      if (myData.action && oppData.action && !data.roundResolved) {
        if (playerKey === 'p1') {
          resolveRound(myData.action, oppData.action);
        }
      }

      // 次のラウンドに遷移した際の解除処理
      if (data.roundResolved && myData.action === null) {
        setAllButtonsDisabled(false);
        resetTurnTimer();
      }
    }

    // --- ボタン有効・無効制御（修正版） ---
    function setAllButtonsDisabled(disabled) {
      document.getElementById('btn-attack').disabled = disabled;
      document.getElementById('btn-heal').disabled = disabled;
      document.getElementById('btn-charge').disabled = disabled;
      document.getElementById('btn-guard').disabled = disabled;
      // 降参ボタンは技選択後も押せるようにするため、ここでは操作しない
    }

    // --- UI（ゲージ）の更新 ---
    function updateUI() {
      // 自分のステータス
      document.getElementById('my-hp-text').innerText = `${myHP}/100`;
      document.getElementById('my-hp-bar').style.width = `${Math.max(0, myHP)}%`;
      document.getElementById('my-sp-text').innerText = `${mySP}/100`;
      document.getElementById('my-sp-bar').style.width = `${Math.min(100, mySP)}%`;

      // 相手のステータス
      document.getElementById('opp-hp-text').innerText = `${oppHP}/100`;
      document.getElementById('opp-hp-bar').style.width = `${Math.max(0, oppHP)}%`;
      document.getElementById('opp-sp-text').innerText = `${oppSP}/100`;
      document.getElementById('opp-sp-bar').style.width = `${Math.min(100, oppSP)}%`;

      // 回復ボタンの使用可否（SP100時のみ）
      if (mySP < 100 && !document.getElementById('btn-heal').disabled) {
        document.getElementById('btn-heal').disabled = true;
      }
    }

    // --- プレイヤーの行動選択 ---
    function playerAction(action) {
      if (!inBattle) return;

      // SP消費チェック
      if (action === 'heal' && mySP < 100) {
        alert('SPが足りません！');
        return;
      }

      // 技選択後は他の技ボタンを無効化（降参ボタンは押せる状態を保持）
      setAllButtonsDisabled(true);
      logMsg(`👉 行動選択: [${getActionName(action)}] 相手の選択を待っています...`);

      // データベースに行動を送信
      matchRef.child(playerKey).update({ action: action });
    }

    function getActionName(action) {
      switch(action) {
        case 'attack': return '⚔️ こうげき';
        case 'charge': return '⚡ ため';
        case 'guard': return '🛡️ がード';
        case 'heal': return '💊 かいふく';
        default: return '❓ 未選択';
      }
    }

    // --- ラウンド結果の判定（P1側で一括計算） ---
    function resolveRound(p1Act, p2Act) {
      // フラグを立てて二重計算を防止
      matchRef.update({ roundResolved: true });

      matchRef.once('value').then(snap => {
        const data = snap.val();
        let p1 = data.p1;
        let p2 = data.p2;

        let p1Dmg = 0;
        let p2Dmg = 0;

        // SP増減計算
        if (p1Act === 'attack') p1.sp = Math.min(100, p1.sp + 20);
        if (p1Act === 'charge') p1.sp = Math.min(100, p1.sp + 40);
        if (p1Act === 'guard') p1.sp = Math.min(100, p1.sp + 10);
        if (p1Act === 'heal') p1.sp = 0;

        if (p2Act === 'attack') p2.sp = Math.min(100, p2.sp + 20);
        if (p2Act === 'charge') p2.sp = Math.min(100, p2.sp + 40);
        if (p2Act === 'guard') p2.sp = Math.min(100, p2.sp + 10);
        if (p2Act === 'heal') p2.sp = 0;

        // ダメージ・回復計算
        // P1攻撃
        if (p1Act === 'attack') {
          p2Dmg = (p2Act === 'guard') ? 10 : 25;
        }
        // P2攻撃
        if (p2Act === 'attack') {
          p1Dmg = (p1Act === 'guard') ? 10 : 25;
        }

        // 回復処理
        if (p1Act === 'heal') p1.hp = Math.min(100, p1.hp + 50);
        if (p2Act === 'heal') p2.hp = Math.min(100, p2.hp + 50);

        // ダメージ適用
        p1.hp = Math.max(0, p1.hp - p1Dmg);
        p2.hp = Math.max(0, p2.hp - p2Dmg);

        // ログ出力（共通）
        const roundLog = `【結果】P1: ${getActionName(p1Act)} / P2: ${getActionName(p2Act)}`;

        // 次ラウンドへのリセット更新
        setTimeout(() => {
          matchRef.update({
            'p1/hp': p1.hp,
            'p1/sp': p1.sp,
            'p1/action': null,
            'p2/hp': p2.hp,
            'p2/sp': p2.sp,
            'p2/action': null,
            'roundResolved': false,
            'lastLog': roundLog
          });
        }, 1000);
      });
    }

    // --- タイマー関連 ---
    function startTimers() {
      matchTimeLeft = 180;
      turnTimeLeft = 15;

      matchTimerInterval = setInterval(() => {
        matchTimeLeft--;
        document.getElementById('match-timer').innerText = matchTimeLeft;
        if (matchTimeLeft <= 0) {
          handleMatchTimeout();
        }
      }, 1000);

      resetTurnTimer();
    }

    function resetTurnTimer() {
      clearInterval(turnTimerInterval);
      turnTimeLeft = 15;
      document.getElementById('turn-timer').innerText = turnTimeLeft;

      turnTimerInterval = setInterval(() => {
        turnTimeLeft--;
        document.getElementById('turn-timer').innerText = turnTimeLeft;
        if (turnTimeLeft <= 0) {
          // 時間切れ時は自動で「こうげき」を選択
          if (inBattle && !document.getElementById('btn-attack').disabled) {
            logMsg('⏰ 時間切れ！自動的に「こうげき」を選択します。');
            playerAction('attack');
          }
        }
      }, 1000);
    }

    function stopBattleTimers() {
      clearInterval(matchTimerInterval);
      clearInterval(turnTimerInterval);
    }

    // 試合の制限時間切れ処理（修正版）
    function handleMatchTimeout() {
      if (!inBattle) return;
      logMsg('⏱️ <strong>3分経過！試合終了です！</strong>');
      setAllButtonsDisabled(true);
      document.getElementById('btn-surrender').disabled = true; // 降参ボタンも無効化

      setTimeout(() => {
        if (myHP > oppHP) {
          finishBattle('win');
        } else if (myHP < oppHP) {
          finishBattle('lose');
        } else {
          finishBattle('draw');
        }
      }, 1500);
    }

    // --- 降参処理 ---
    function surrender() {
      if (!inBattle) return;
      if (confirm('本当に降参しますか？')) {
        logMsg('🏳️ 降参しました。');
        finishBattle('lose');
      }
    }

    // --- 勝敗確定処理（修正版） ---
    function finishBattle(result) {
      inBattle = false;
      stopBattleTimers();
      setAllButtonsDisabled(true);
      document.getElementById('btn-surrender').disabled = true; // 降参ボタンも無効化

      let rateChange = 0;
      if (result === 'win') {
        rateChange = 16;
        myRate += rateChange;
        alert(`🎉 勝利！ レートが ${rateChange} 上昇しました！（現在: ${myRate}）`);
      } else if (result === 'lose') {
        rateChange = 16;
        myRate = Math.max(0, myRate - rateChange);
        alert(`😭 敗北... レートが ${rateChange} 減少しました。（現在: ${myRate}）`);
      } else {
        alert(`🤝 引き分け！ レートの変動はありません。（現在: ${myRate}）`);
      }

      // レート保存
      localStorage.setItem('kisomon_rate', myRate);

      // リセットしてマッチング画面に戻る
      setTimeout(() => {
        if (matchRef) matchRef.off();
        document.getElementById('screen-battle').classList.add('hidden');
        document.getElementById('screen-matching').classList.remove('hidden');

        document.getElementById('display-rate').innerText = myRate;
        document.getElementById('display-rank').innerText = getRankName(myRate);
        document.getElementById('btn-match').disabled = false;
        document.getElementById('btn-surrender').disabled = false;
        document.getElementById('matching-status').innerText = '';
      }, 2000);
    }

    // ログ書き込み処理
    function logMsg(msg) {
      const logArea = document.getElementById('log-area');
      const div = document.createElement('div');
      div.className = 'log-item';
      div.innerHTML = msg;
      logArea.insertBefore(div, logArea.firstChild);
    }
  </script>
</body>
</html>
